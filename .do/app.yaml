# DigitalOcean App Platform spec template for the Laravel backend.
#
# This is a starting point, not a ready-to-apply file — replace the REPLACE_ME
# placeholders (repo owner, domains, secrets) before using it, either via
# `doctl apps create --spec .do/app.yaml` or by pasting it in the App Platform
# "Edit Spec" tab. See docs/DEPLOYMENT.md for the full walkthrough.
#
# Database is TiDB Cloud (external, not a DO resource) — there's no `databases:`
# section here, DB_* below are set directly from your TiDB Cloud connection
# details instead of being bound via ${db-mysql.*}.
#
# All four components (api / queue / scheduler / migrate) share the same
# Dockerfile image — only run_command differs. Their envs all reuse the
# &shared-envs YAML anchor defined on `api` below, so edit values in one place.

name: library-management-api
region: sgp

services:
  - name: api
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_ME_github-owner/Library_Management_System
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /up
      initial_delay_seconds: 30
      period_seconds: 15
    envs: &shared-envs
      - key: APP_NAME
        value: "Library Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        type: SECRET
        value: REPLACE_ME_run_php_artisan_key_generate_--show_locally_and_paste_output
      - key: APP_URL
        value: REPLACE_ME_https://library-management-api-xxxxx.ondigitalocean.app
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: REPLACE_ME_gateway01.region.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: REPLACE_ME_tidb-database-name
      - key: DB_USERNAME
        type: SECRET
        value: REPLACE_ME_tidb-username
      - key: DB_PASSWORD
        type: SECRET
        value: REPLACE_ME_tidb-password
      # TiDB Cloud rejects unencrypted connections (see app/Services/BackupService.php
      # comments) — mysqldump already passes --ssl unconditionally. For the PDO
      # connection, TiDB Cloud's cert chains to a public CA already trusted by the
      # image's system CA bundle, so this can usually stay unset; only fill it in
      # if you hit an SSL handshake error and want to pin TiDB's CA explicitly.
      # - key: MYSQL_ATTR_SSL_CA
      #   value: /etc/ssl/certs/ca-certificates.crt
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MEDIA_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        type: SECRET
        value: REPLACE_ME_spaces-access-key
      - key: AWS_SECRET_ACCESS_KEY
        type: SECRET
        value: REPLACE_ME_spaces-secret-key
      - key: AWS_DEFAULT_REGION
        value: REPLACE_ME_sgp1
      - key: AWS_BUCKET
        value: REPLACE_ME_library-uploads
      - key: AWS_ENDPOINT
        value: REPLACE_ME_https://sgp1.digitaloceanspaces.com
      - key: AWS_URL
        value: REPLACE_ME_https://library-uploads.sgp1.digitaloceanspaces.com
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: REPLACE_ME_https://admin.example.com,https://www.example.com
      - key: FRONTEND_URL
        value: REPLACE_ME_https://www.example.com
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        type: SECRET
        value: REPLACE_ME_gmail-address
      - key: MAIL_PASSWORD
        type: SECRET
        value: REPLACE_ME_gmail-app-password
      - key: MAIL_FROM_ADDRESS
        value: REPLACE_ME_gmail-address
      - key: GOOGLE_CLIENT_ID
        type: SECRET
        value: REPLACE_ME
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
        value: REPLACE_ME
      - key: GOOGLE_REDIRECT_URI
        value: REPLACE_ME_https://library-management-api-xxxxx.ondigitalocean.app/api/v1/auth/google/callback
      - key: GEMINI_API_KEY
        type: SECRET
        value: REPLACE_ME
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_MOCK_MODE
        value: "false"

workers:
  - name: queue
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_ME_github-owner/Library_Management_System
      branch: main
      deploy_on_push: true
    run_command: php artisan queue:work --tries=3 --max-time=3300 --sleep=3
    instance_count: 1
    instance_size_slug: basic-xxs
    envs: *shared-envs

  - name: scheduler
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_ME_github-owner/Library_Management_System
      branch: main
      deploy_on_push: true
    run_command: php artisan schedule:work
    instance_count: 1
    instance_size_slug: basic-xxs
    envs: *shared-envs

jobs:
  - name: migrate
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: REPLACE_ME_github-owner/Library_Management_System
      branch: main
      deploy_on_push: true
    run_command: php artisan migrate --force
    kind: PRE_DEPLOY
    instance_count: 1
    instance_size_slug: basic-xxs
    envs: *shared-envs
