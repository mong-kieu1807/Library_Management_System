; Production overrides — copied onto the base php.ini-production in the image.
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120
expose_php = Off

; Immutable container image — the filesystem doesn't change after build, so
; skip the per-request mtime check for a real perf win.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Log to stderr so `docker logs` / DO App Platform's log stream picks it up.
log_errors = On
error_log = /dev/stderr
